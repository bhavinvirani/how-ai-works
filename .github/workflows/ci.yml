name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs on the same ref are pointless — cancel them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lint, formatting, types, and unit tests share one install, because they are
  # fast and a single red job for "code quality" is easier to read than four.
  quality:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm/action-setup MUST come before setup-node: setup-node's `cache: pnpm`
      # shells out to pnpm to locate the store and fails if it is not yet on PATH.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Types
        run: pnpm check

      - name: Unit tests
        run: pnpm test

  # Runs against the BUILT site with the base path applied — the only setup
  # where base-path bugs and missing self-hosted assets actually surface.
  e2e:
    name: E2E smoke + a11y
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Headless-only suite, so the shell build is enough and downloads far less
      # than full Chromium. This is why playwright.config.ts sets no `channel` —
      # --only-shell is incompatible with one.
      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium

      # `pnpm test:e2e` builds first, then serves dist/ via astro preview.
      - name: Run Playwright
        run: pnpm test:e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Internal links are written base-absolute (/how-ai-works/...), so they
      # only resolve against a tree that mirrors the deployed layout. Staging
      # dist/ under that prefix is what makes --offline checking meaningful.
      - name: Stage built site at its deployed path
        run: |
          mkdir -p _site/how-ai-works
          cp -r dist/. _site/how-ai-works/

      # Internal links are a hard failure: a broken one is our bug.
      - name: Check internal links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --base _site "_site/**/*.html"
          fail: true

      # External links are informational only — third-party sites go down, rate
      # limit CI, and rename pages, none of which should block a merge.
      - name: Check external links (soft-fail)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --include-mail --base _site "_site/**/*.html"
          fail: false
          output: lychee-external.md
