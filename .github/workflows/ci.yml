name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs on the same ref are pointless — cancel them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lint, formatting, types, and unit tests share one install, because they are
  # fast and a single red job for "code quality" is easier to read than four.
  quality:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm/action-setup MUST come before setup-node: setup-node's `cache: pnpm`
      # shells out to pnpm to locate the store and fails if it is not yet on PATH.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Types
        run: pnpm check

      - name: Unit tests
        run: pnpm test

  # Runs against the BUILT site with the base path applied — the only setup
  # where base-path bugs and missing self-hosted assets actually surface.
  # Budgets share this job because they need the same dist/ and building twice
  # buys nothing.
  e2e:
    name: Build, budgets, E2E + a11y
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Headless-only suite, so the shell build is enough and downloads far less
      # than full Chromium. This is why playwright.config.ts sets no `channel` —
      # --only-shell is incompatible with one.
      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium

      # Built once here, then reused by both the budget check and Playwright's
      # preview server, rather than letting `pnpm test:e2e` build again.
      - name: Build
        run: pnpm build

      # Runs before Playwright so a bloated island is still reported when a
      # test elsewhere is failing.
      - name: Island budgets
        run: node scripts/check-budgets.mjs

      - name: Run Playwright
        run: pnpm exec playwright test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Internal links are written base-absolute (/how-ai-works/...), so they
      # only resolve against a tree that mirrors the deployed layout. Staging
      # dist/ under that prefix is what makes --offline checking meaningful.
      - name: Stage built site at its deployed path
        run: |
          mkdir -p _site/how-ai-works
          cp -r dist/. _site/how-ai-works/

      # --root-dir (not --base) is what resolves root-relative hrefs in local
      # files, and it must be an absolute path. Internal links are a hard
      # failure: a broken one is our bug.
      - name: Check internal links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline --no-progress
            --root-dir "${{ github.workspace }}/_site"
            "_site/**/*.html"
          fail: true

      # External links are informational only — third-party sites go down, rate
      # limit CI, and rename pages, none of which should block a merge.
      - name: Check external links (soft-fail)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --root-dir "${{ github.workspace }}/_site"
            "_site/**/*.html"
          fail: false
          failIfEmpty: false
          output: lychee-external.md
