name: Preview build

# Half one of the two-workflow preview split.
#
# This half runs `on: pull_request`, which for a PR from a FORK gets a
# read-only GITHUB_TOKEN — so it deliberately does no publishing at all. It
# only builds and hands the result to preview-deploy.yml via an artifact.
#
# A single-workflow preview works fine for the maintainer and fails silently
# for every external contributor, and external contributions are exactly what
# the GitHub web editor produces (it always forks first). Building the split
# now costs the same as the naive version and avoids a rewrite later.
on:
  pull_request:
    types: [opened, synchronize, reopened]

# Read-only, explicitly. Nothing here should be able to write to the repo.
permissions:
  contents: read

concurrency:
  group: preview-build-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The preview is served from a subdirectory, not the site root, so it has
      # to be BUILT for that path. Without this override every asset URL points
      # at the production base and the preview 404s while the live site looks
      # fine.
      #
      # The directory is `pr-<number>`, not `<number>`: rossjrw/pr-preview-action
      # prefixes the umbrella directory entry. Getting this wrong deploys
      # successfully and still 404s every asset, which is how it was caught.
      - name: Build for the preview path
        run: pnpm build
        env:
          BASE_PATH: /how-ai-works/pr-preview/pr-${{ github.event.number }}

      # The deploy half runs on `workflow_run`, where the PR number is not
      # reliably available for forks — so pass it along explicitly.
      - name: Record PR number
        run: echo "${{ github.event.number }}" > dist/.pr-number

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-dist
          path: dist/
          retention-days: 3
          include-hidden-files: true
