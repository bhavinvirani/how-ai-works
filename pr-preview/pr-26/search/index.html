n-fast)] ease-out-soft hover:text-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus aria-[current=page]:font-medium aria-[current=page]:text-accent">Gallery</a></li><li><a href="/how-ai-works/pr-preview/pr-26/progress" class="rounded-sm px-1.5 py-1 text-sm text-ink-muted transition-colors duration-[var(--duration-fast)] ease-out-soft hover:text-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus aria-[current=page]:font-medium aria-[current=page]:text-accent">Progress</a></li></ul></nav></header><main class="content mx-auto max-w-3xl px-6 py-16"><h1>Search the lessons</h1><p>Searches the text of all sixty lessons. It runs entirely in your browser — the index is downloaded with the page, and nothing you type is sent anywhere.</p><form id="search-form" role="search" class="not-content my-8 flex flex-col gap-2"><label for="search-input" class="text-sm font-medium text-ink-muted">What are you looking for?</label><div class="flex gap-2"><input id="search-input" type="search" name="q" autocomplete="off" placeholder="attention, overfitting, why models refuse…" class="min-w-0 flex-1 rounded-md border border-rule-strong bg-paper-raised px-3 py-2 text-ink placeholder:text-ink-faint focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus"><button type="submit" class="shrink-0 rounded-md border border-rule-strong bg-paper-raised px-3 py-2 text-sm text-ink hover:bg-paper-sunken focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus">Search</button></div></form><noscript><p>Search needs JavaScript, because the index is downloaded and queried in your browser rather than on a server. Every lesson is reachable without it from the contents list on any lesson page.</p></noscript><p id="search-status" aria-live="polite" class="text-sm text-ink-muted"></p><ol id="search-results" aria-label="Search results" class="not-content flex list-none flex-col gap-6 p-0"></ol></main></body></html><script>(function(){const bundlePath = "/how-ai-works/pr-preview/pr-26/pagefind/";
const strings = {"searching":"Searching…","empty":"Nothing matched that. Try a single word, or a plainer one.","failed":"The search index could not be loaded. It is built with the site, so this usually means an incomplete deployment rather than a problem with what you typed.","countOne":"One lesson matches.","results":"Search results"};

  // Inline and untyped on purpose: `define:vars` is what carries the
  // base-aware bundle path from the server into the browser, and it only works
  // on an inline script. The alternative — hardcoding '/pagefind/' — is the bug
  // this whole file exists to avoid.
  const form = document.querySelector('#search-form');
  const input = document.querySelector('#search-input');
  const status = document.querySelector('#search-status');
  const list = document.querySelector('#search-results');

  let pagefind = null;

  async function loadPagefind() {
    if (pagefind) return pagefind;
    // Concatenated so the bundler leaves it alone: this module is generated
    // after the build and does not exist at bundle time.
    pagefind = await import(/* @vite-ignore */ `${bundlePath}pagefind.js`);
    await pagefind.options({ baseUrl: bundlePath.replace(/pagefind\/$/, '') });
    return pagefind;
  }

  function clear() {
    while (list.firstChild) list.removeChild(list.firstChild);
  }

  function render(results) {
    clear();

    for (const result of results) {
      const item = document.createElement('li');
      item.className = 'flex flex-col gap-1';

      const heading = document.createElement('a');
      heading.href = result.url;
      heading.textContent = result.meta?.title ?? result.url;
      heading.className =
        'font-display text-lg font-semibold text-ink underline decoration-accent underline-offset-4';

      const excerpt = document.createElement('p');
      excerpt.className = 'text-sm text-ink-muted';
      // Pagefind's excerpt marks the matched words with <mark>, which is the
      // one piece of markup worth keeping — it is a semantic element, and the
      // string comes from our own indexed pages rather than from user input.
      excerpt.innerHTML = result.excerpt;

      item.append(heading, excerpt);
      list.append(item);
    }
  }

  async function run(query) {
    if (!query.trim()) {
      clear();
      status.textContent = '';
      return;
    }

    status.textContent = strings.searching;

    let search;
    try {
      const api = await loadPagefind();
      search = await api.search(query);
    } catch {
      clear();
      status.textContent = strings.failed;
      return;
    }

    const found = await Promise.all(
      search.results.slice(0, 20).map((result) => result.data()),
    );

    if (found.length === 0) {
      clear();
      status.textContent = strings.empty;
      return;
    }

    status.textContent =
      found.length === 1
        ? strings.countOne
        : `${String(found.length)} lessons match.`;
    render(found);
  }

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    void run(input.value);
  });

  let pending;
  input.addEventListener('input', () => {
    clearTimeout(pending);
    pending = setTimeout(() => {
      void run(input.value);
    }, 200);
  });

  // Deep links: /search?q=attention should arrive already searched.
  const initial = new URLSearchParams(window.location.search).get('q');
  if (initial) {
    input.value = initial;
    void run(initial);
  }
})();</script>
